name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Verifies gradle-wrapper.jar against the official checksums so a
      # tampered wrapper can never execute in CI (the release job inherits
      # this guarantee via `needs: check`).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ktlint, Android Lint, unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7

  release:
    name: Build release APKs
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Creating a GitHub Release writes to the repository, which the default
    # GITHUB_TOKEN cannot do (workflow tokens are read-only by default).
    permissions:
      contents: write
    env:
      # Only signed APKs can be attached to a draft GitHub release.
      HAS_SIGNING_SECRETS: >-
        ${{
          secrets.SIGNING_KEYSTORE_BASE64 != '' &&
          secrets.SIGNING_KEYSTORE_PASSWORD != '' &&
          secrets.SIGNING_KEY_ALIAS != '' &&
          secrets.SIGNING_KEY_PASSWORD != ''
        }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      - name: Verify APK signatures
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "==> $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload release build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.HAS_SIGNING_SECRETS == 'true' && 'inbo-release' || 'inbo-unsigned-release' }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create draft GitHub release
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Inbo ${{ github.ref_name }}
          draft: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
